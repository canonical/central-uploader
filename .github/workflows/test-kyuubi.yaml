name: Run Kyuubi integration tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated list of branches to test"
        required: true
        default: "lp-1.12.0"

jobs:
  prepare_matrix:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    steps:
      - id: setup_matrix
        run: |
          input=${{ inputs.branches }}
          echo "matrix=[\"${input//,/\",\"}\"]" >> $GITHUB_OUTPUT
          echo "[\"${input//,/\",\"}\"]"
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.matrix }}

  test_kyuubi:
    needs: prepare_matrix
    runs-on: [self-hosted, linux, X64, large, noble]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone Kyuubi and checkout test branch
        env:
          BRANCH: ${{ matrix.branch || 'lp-1.10.2' }}
          REPO_URL: ${{ secrets.REPO_KYUUBI_URL }}
        run: |
          set -euo pipefail
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
          git clone --progress --verbose "$REPO_URL" charmed-kyuubi
          git -C charmed-kyuubi checkout "$BRANCH"
          echo "Testing Kyuubi branch: $BRANCH"

      - name: Set up LXD
        uses: canonical/setup-lxd@148b75cb43f4ac1356752fad771cc418cb215033 # main
        with:
          channel: 6/stable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Install Spread
        run: |
          go install github.com/canonical/spread/cmd/spread@master
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate UUID
        id: uuid
        timeout-minutes: 5
        run: |
          uuid=$(uuidgen)
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Run Kyuubi Spread task
        working-directory: charmed-kyuubi
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          KYUUBI_ARTIFACTORY_URL: ${{ secrets.KYUUBI_ARTIFACTORY_URL }}
        run: |
          set -euo pipefail
          spread -v -artifacts="$GITHUB_WORKSPACE/spread-artifacts" \
            lp/ci/tests
        timeout-minutes: 180

      - name: Stage Spread logs for validation
        if: always()
        env:
          RUN_UUID: ${{ steps.uuid.outputs.uuid }}
        run: |
          set -euo pipefail
          mkdir -p results
          archive=$(find spread-artifacts -type f -name logs.zip -print -quit 2>/dev/null || true)
          if [[ -n "$archive" ]]; then
            cp "$archive" "results/logs-${RUN_UUID}.zip"
          else
            echo "No Spread log archive found"
          fi

      - name: Upload locally built artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-${{ steps.uuid.outputs.uuid }}
          path: results/*.zip
          if-no-files-found: warn

  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test_kyuubi
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: results/
          pattern: integration-test-logs-*
          merge-multiple: true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Print results
        run: |
          python3 -m ie-tests.validate_spark_kyuubi -a "results/"
          echo "Analysis finished"

      - name: Compress logs
        run: zip -r all-results.zip results

      - name: Upload all test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-uuid
          path: all-results.zip
