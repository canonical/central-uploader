name: Run Flink tests suite

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated list of branches to test"
        required: true
        default: "lp-2.2.0"

permissions:
  contents: read

jobs:
  prepare_matrix:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    steps:
      - id: setup_matrix
        run: |
          input=${{ inputs.branches }}
          echo "matrix=[\"${input//,/\",\"}\"]" >> $GITHUB_OUTPUT
          echo "[\"${input//,/\",\"}\"]"
    outputs:
      # matrix: ${{ steps.setup_matrix.outputs.matrix }}
      matrix: '["lp-2.2.0","release-2.2.0-ubuntu0"]'

  test_flink:
    needs: prepare_matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        branch: ${{fromJson(needs.prepare_matrix.outputs.matrix)}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo snap install yq
          sudo apt update
          sudo apt install -y maven python3-dev
          sudo apt install -y gosu locales make less build-essential curl libapr1 unzip uuid-runtime jq bsdmainutils wget psmisc software-properties-common apt-transport-https
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: ssh agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Clone repo
        run: |
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
          echo "cloning..."
          git clone --progress --verbose ${{ secrets.REPO_FLINK_URL }}
          echo "cloned!"
          cp -r ie-tests charmed-flink
      - name: Generate uuid
        id: uuid
        timeout-minutes: 5
        run: |
          # Generate uuid
          uuid=$(uuidgen)
          echo "uuid=$uuid" >> $GITHUB_OUTPUT

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6

      - name: Setup maven credential
        run: |
          echo "Setup custom settings.xml"
          mkdir -p ~/.m2
          mv ie-tests/settings.xml  ~/.m2/settings.xml

      - name: Run integration test
        timeout-minutes: 180
        env:
          USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_URL: ${{ secrets.FLINK_ARTIFACTORY_URL }}
        run: |
          echo "Maven version"
          mvn -version

          cd charmed-flink


          branch=${{ matrix.branch }}
          echo "Branch: $branch"
          if [ -z "$branch" ];
          then
            branch="lp-2.2.0"
          fi
          echo "Branch to test: $branch"

          git checkout $branch
          # add extra folder and files to be not scanned by rat
          echo "ie-tests/*" >> .rat-excludes
          echo "**/ie-tests/*" >> .rat-excludes
          echo "lp/*" >> .rat-excludes

          # cd ie-tests
          mkdir logs

          echo "Start tests suite for Flink"
          # mvn wrapper:wrapper -Dmaven=3.8.6 -Dtype=bin
          mvn clean -DskipTests -Dinclude_hadoop_aws -Djdk17 -Pjava17-target -Pgithub-actions -Drat.skip=true install

          echo "Start tests suite for Flink"
          export JUNIT_JUPITER_EXECUTION_TIMEOUT_DEFAULT="5m"
          mvn -Dflink.forkCountUnitTest=1 -Dflink.forkCountITCase=1 -DreuseForks=false -Dflink.tests.check-segment-multiple-free -Darchunit.freeze.store.default.allowStoreUpdate=false -Dinclude_hadoop_aws -Djdk17 -Pjava17-target -Pgithub-actions -Drat.skip=true -pl flink-annotations,flink-test-utils-parent/flink-test-utils,flink-state-backends,flink-state-backends/flink-statebackend-changelog,flink-state-backends/flink-statebackend-heap-spillable,flink-state-backends/flink-statebackend-rocksdb,flink-state-backends/flink-statebackend-forst,flink-clients,flink-core,flink-rpc,flink-rpc/flink-rpc-core,flink-rpc/flink-rpc-akka,flink-rpc/flink-rpc-akka-loader,flink-runtime,flink-runtime-web,flink-streaming-java,flink-metrics,flink-metrics/flink-metrics-core,flink-external-resources,flink-external-resources/flink-external-resource-gpu,flink-libraries,flink-libraries/flink-cep,flink-libraries/flink-state-processing-api,flink-queryable-state,flink-queryable-state/flink-queryable-state-runtime,flink-queryable-state/flink-queryable-state-client-java,flink-container,flink-dstl,flink-dstl/flink-dstl-dfs -fn verify >> "logs/logs-${branch}.out"
          # mvn -Dflink.tests.check-segment-multiple-free -Darchunit.freeze.store.default.allowStoreUpdate=false -Dinclude_hadoop_aws -Djdk17 -Pjava17-target -Pgithub-actions -Drat.skip=true -pl flink-table,flink-table/flink-sql-parser,flink-table/flink-table-common,flink-table/flink-table-api-java,flink-table/flink-table-api-scala,flink-table/flink-table-api-bridge-base,flink-table/flink-table-api-java-bridge,flink-table/flink-table-api-scala-bridge,flink-table/flink-table-api-java-uber,flink-table/flink-sql-client,flink-table/flink-sql-gateway-api,flink-table/flink-sql-gateway,flink-table/flink-table-planner,flink-table/flink-table-planner-loader,flink-table/flink-table-planner-loader-bundle,flink-table/flink-table-runtime,flink-table/flink-table-code-splitter,flink-table/flink-table-test-utils -fn test >> "logs/logs-${branch}.out"

          # /bin/bash run.sh $branch "${TEST_COMMAND}"
          echo "End of the test"
          cat logs/*.out
          # compress logs to final upload
          zip -r logs-${{steps.uuid.outputs.uuid }}.zip logs
          echo "End of the tests"
          pwd
          ls

      - name: Upload locally built artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: integration-test-logs-${{steps.uuid.outputs.uuid }}
          path: charmed-flink/logs-${{steps.uuid.outputs.uuid }}.zip

  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      test_flink
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout results
        uses: actions/download-artifact@v8
        with:
          path: results/
          pattern: integration-test-logs-*
          merge-multiple: true
      - name: Install python dependencies
        run: |
          # install requirements
          pip install -r requirements.txt
      - name: Print results
        run: |
          # run the validate script
          python3 -m ie-tests.validate_hadoop -a "results/"
          echo "Analyis finished"
      - name: Compress logs
        run: |
          zip -r all-results.zip results
          echo "END"
      - name: Upload all tests logs
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-uuid
          path: all-results.zip
