name: Run hadoop integration tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated list of branches to test"
        required: true
        default: "lp-3.4.2,lp-3.4.2,lp-3.4.2"

jobs:
  prepare_matrix:
    name: Prepare matrix
    runs-on: ubuntu-22.04
    steps:
      - id: setup_matrix
        run: |
          input=${{ inputs.branches }}
          echo "matrix=[\"${input//,/\",\"}\"]" >> $GITHUB_OUTPUT
          echo "[\"${input//,/\",\"}\"]"
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.matrix }}

  test_hadoop:
    needs: prepare_matrix
    runs-on: [self-hosted, linux, X64, large, noble]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        branch: ${{fromJson(needs.prepare_matrix.outputs.matrix)}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo snap install yq
          sudo apt-get update
          sudo apt-get -y install ant \
          apt-utils \
          automake \
          bats \
          build-essential \
          bzip2 \
          libbz2-dev \
          clang \
          cmake \
          curl \
          libcurl4-openssl-dev \
          doxygen \
          fuse \
          libfuse-dev \
          gcc \
          g++ \
          git \
          gnupg-agent \
          hugo \
          libbcprov-java \
          libtool \
          libssl-dev \
          libprotobuf-dev \
          libprotoc-dev \
          libsasl2-dev \
          libsnappy-dev \
          libzstd-dev \
          zlib1g-dev \
          locales \
          libtirpc-dev \
          make \
          maven \
          openjdk-17-jdk \
          pinentry-curses \
          pkg-config \
          python3 \
          python3-pip \
          python3-pkg-resources \
          python3-setuptools \
          python3-wheel \
          rsync \
          shellcheck \
          software-properties-common \
          valgrind \
          yasm \
          zip
          sudo update-java-alternatives -s $(update-java-alternatives -l | grep '17' | cut -d " " -f1) || echo '.'

      - name: ssh agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Clone repo
        run: |
          ls ~/
          # sudo mkdir ~/.ssh
          # ls ~/.ssh/
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
          echo "cloning..."
          git clone --progress --verbose ${{ secrets.REPO_URL }}
          echo "cloned!"
          cp -r ie-tests hadoop
      - name: Generate uuid
        id: uuid
        timeout-minutes: 5
        run: |
          ls
          ls -larth
          uuid=$(uuidgen)
          echo "uuid=$uuid" >> $GITHUB_OUTPUT

      - name: Run integration test
        timeout-minutes: 900
        run: |
          cd hadoop
          cd ie-tests
          branch=${{matrix.branch}}
          echo "Branch: $branch"
          if [ -z "$branch" ];
          then
            branch="lp-3.4.2"
          fi
          echo "Branch: $branch"
          ls
          /bin/bash run.sh $branch
          ls
          echo "End of the test"
          zip -r logs-${{steps.uuid.outputs.uuid }}.zip logs

      - name: Upload locally built artifact
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-logs-${{steps.uuid.outputs.uuid }}
          path: hadoop/ie-tests/logs-${{steps.uuid.outputs.uuid }}.zip
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs:
      test_hadoop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout results
        uses: actions/download-artifact@v5
        with:
          path: results/
          pattern: integration-test-logs-*
          merge-multiple: true
      - name: Install python dependencies
        run: |
          # install requirements
          pip install -r requirements.txt
      - name: Print results
        run: |
          # run the validate script
          python3 -m ie-tests.validate_hadoop  -a "results/"
          echo "Analyis finished"
      - name: Compress logs
        run: |
          zip -r all-results.zip results
          echo "END"
      - name: Upload all tests logs
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-uuid
          path: all-results.zip
