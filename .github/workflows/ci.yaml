name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tox and poetry
        run: |
          python3 -m pip install tox
          curl -sSL https://install.python-poetry.org | python3 -
          which poetry
          poetry --version
      - name: Run linters
        run: tox -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tox and poetry
        run: |
          python3 -m pip install tox
          curl -sSL https://install.python-poetry.org | python3 -
          which poetry
          poetry --version
          poetry self add poetry-plugin-export
      - name: Run tests
        run: tox -e unit
