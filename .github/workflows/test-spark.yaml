name: Run Spark integration tests

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated list of branches to test"
        required: true
        default: "lp-4.2.1,lp-4.2.1,lp-4.2.1"

jobs:
  prepare_matrix:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    steps:
      - id: setup_matrix
        run: |
          input=${{ inputs.branches }}
          echo "matrix=[\"${input//,/\",\"}\"]" >> $GITHUB_OUTPUT
          echo "[\"${input//,/\",\"}\"]"
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.matrix }}

  test_spark:
    needs: prepare_matrix
    runs-on: [self-hosted, linux, X64, large, noble]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        branch: ${{fromJson(needs.prepare_matrix.outputs.matrix)}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ssh agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone repo and checkout test branch
        env:
          BRANCH: ${{ matrix.branch || 'lp-4.2.1' }}
          REPO_URL: ${{ secrets.REPO_SPARK_URL }}
        run: |
          set -euo pipefail
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
          echo "cloning..."
          git clone --progress --verbose "$REPO_URL" charmed-spark
          echo "cloned!"
          echo "Checking out test branch: $BRANCH"
          git -C charmed-spark checkout "$BRANCH"

          echo "Branch to test: $BRANCH"

      - name: Set up LXD
        uses: canonical/setup-lxd@148b75cb43f4ac1356752fad771cc418cb215033 # main
        with:
          channel: 6/stable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Install Spread
        run: |
          go install github.com/canonical/spread/cmd/spread@master
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate uuid
        id: uuid
        timeout-minutes: 5
        run: |
          uuid=$(uuidgen)
          echo "uuid=$uuid" >> $GITHUB_OUTPUT

      - name: Run Spark Spread task
        working-directory: charmed-spark
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          SPARK_ARTIFACTORY_URL: ${{ secrets.SPARK_ARTIFACTORY_URL }}
        run: |
          spread -vv -artifacts="$GITHUB_WORKSPACE/spread-artifacts" \
            lp/ci/tests
        timeout-minutes: 900

      - name: Stage logs for validation
        if: always()
        env:
          RUN_UUID: ${{ steps.uuid.outputs.uuid }}
        run: |
          set -euo pipefail
          mkdir -p results
          archive=$(find spread-artifacts -type f -name logs.zip -print -quit 2>/dev/null || true)
          if [[ -n "$archive" ]]; then
            cp "$archive" "results/logs-${RUN_UUID}.zip"
          else
            echo "No Spread log archive found"
          fi

      - name: Upload locally built artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-${{steps.uuid.outputs.uuid }}
          path: results/*.zip
          if-no-files-found: warn

  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      test_spark
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: results/
          pattern: integration-test-logs-*
          merge-multiple: true

      - name: Install python dependencies
        run: |
          # install requirements
          pip install -r requirements.txt

      - name: Print results
        run: |
          # run the validate script
          python3 -m ie-tests.validate_spark_kyuubi  -a "results/"
          echo "Analyis finished"

      - name: Compress logs
        run: |
          zip -r all-results.zip results
          echo "END"

      - name: Upload all tests logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-uuid
          path: all-results.zip
