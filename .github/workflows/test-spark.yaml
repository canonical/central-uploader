name: Run Spark integration tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS label"
        required: true
        type: choice
        options:
          - jammy
          - noble
          - resolute
        default: noble
      branches:
        description: "Comma-separated list of branches to test"
        required: true
        default: "lp-4.2.1,lp-4.2.1,lp-4.2.1"

jobs:
  prepare_matrix:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    steps:
      - id: setup_matrix
        run: |
          input=${{ inputs.branches }}
          echo "matrix=[\"${input//,/\",\"}\"]" >> $GITHUB_OUTPUT
          echo "[\"${input//,/\",\"}\"]"
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.matrix }}

  test_spark:
    needs: prepare_matrix
    runs-on: [self-hosted, linux, X64, large, "${{ inputs.runner }}"]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        branch: ${{fromJson(needs.prepare_matrix.outputs.matrix)}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ssh agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone repo and checkout test branch
        env:
          BRANCH: ${{ matrix.branch || 'lp-4.2.1' }}
          REPO_URL: ${{ secrets.REPO_SPARK_URL }}
        run: |
          set -euo pipefail
          ssh-keyscan -t rsa git.launchpad.net >> ~/.ssh/known_hosts
          echo "cloning..."
          git clone --progress --verbose "$REPO_URL" charmed-spark
          echo "cloned!"
          echo "Checking out test branch: $BRANCH"
          git -C charmed-spark checkout "$BRANCH"
          cp -r ie-tests charmed-spark
          echo "Branch to test: $BRANCH"

      - name: Generate uuid
        id: uuid
        timeout-minutes: 5
        run: |
          uuid=$(uuidgen)
          echo "uuid=$uuid" >> $GITHUB_OUTPUT

      - name: Run product-specific integration test
        uses: ./charmed-spark/lp/ci
        with:
          label: ${{ matrix.branch || 'lp-4.2.1' }}
          uuid: ${{ steps.uuid.outputs.uuid }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          artifactory_url: ${{ secrets.SPARK_ARTIFACTORY_URL }}
        timeout-minutes: 900

      - name: Upload locally built artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-${{steps.uuid.outputs.uuid }}
          path: charmed-spark/ie-tests/logs-${{steps.uuid.outputs.uuid }}.zip

  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      test_spark
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: results/
          pattern: integration-test-logs-*
          merge-multiple: true

      - name: Install python dependencies
        run: |
          # install requirements
          pip install -r requirements.txt

      - name: Print results
        run: |
          # run the validate script
          python3 -m ie-tests.validate_spark_kyuubi  -a "results/"
          echo "Analyis finished"

      - name: Compress logs
        run: |
          zip -r all-results.zip results
          echo "END"

      - name: Upload all tests logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-uuid
          path: all-results.zip
